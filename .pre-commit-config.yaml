repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.23
    hooks:
    - id: uv-lock
    - id: uv-export
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.3
    hooks:
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    - id: ruff-format
      types_or: [ python, pyi ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
    - id: gitleaks