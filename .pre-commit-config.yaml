repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.2
    hooks:
    - id: uv-export
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    - id: ruff-format
      types_or: [ python, pyi ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
    - id: gitleaks