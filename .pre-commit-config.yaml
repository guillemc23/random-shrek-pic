repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
    - id: ruff-check
      types_or: [ python, pyi ]
      args: [ --fix ]
    - id: ruff-format
      types_or: [ python, pyi ]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
    - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: '^data/.*\\.txt$'
  - repo: local
    hooks:
      - id: txt-file-checks
        name: Check TXT files for trailing spaces and duplicate lines
        entry: python scripts/precommit_check_txts.py
        language: system
        files: '^data/.*\\.txt$'